<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>登录 · 下载工作台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body class="login-page">
  <main class="login-card" style="margin:0">
    <div class="brand"><span class="brand-symbol">↗</span><span>MEDIA<br><small>DOWNLOADER</small></span></div>
    <div class="eyebrow">WELCOME BACK</div>
    <h1>进入下载工作台</h1>
    <p class="login-description">管理你的媒体，让每一次传输井然有序。</p>
    <form id="login-form">
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="输入工作台访问密码" required autofocus>
      <button class="button primary" id="submit" type="submit">登录工作台 →</button>
      <p class="login-error" id="error" role="alert"></p>
    </form>
    <p class="login-note">使用配置中的 Web 访问密码。远程访问请通过 HTTPS 连接。</p>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('submit'), error = document.getElementById('error');
      button.disabled = true; button.textContent = '正在验证…'; error.textContent = '';
      try {
        const response = await fetch({{ url_for('login')|tojson }}, {
          method:'POST', credentials:'same-origin',
          headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name="csrf-token"]').content},
          body:JSON.stringify({password:document.getElementById('password').value})
        });
        const data = await response.json();
        if (response.ok && data.code === '1') { window.location.assign({{ url_for('index')|tojson }}); return; }
        error.textContent = data.error || '登录失败，请重试';
        document.getElementById('password').select();
      } catch (_) { error.textContent = '连接失败，请检查网络后重试'; }
      finally { button.disabled = false; button.textContent = '登录工作台 →'; }
    });
  </script>
</body>
</html>
